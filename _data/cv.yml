cv:
  name: Yining Li
  label: Research Scientist
  email: liyining@pjlab.org.cn
  location: Shanghai, China
  image: ""
  summary: Research scientist at Shanghai AI Laboratory, leading a team focused on LLM post-training and AI-for-AI. Co-led SFT for InternLM 2/2.5/3 and led agentic coding post-training for Atria Dawn. Research spans training-data pipelines and agentic systems for automated model development and experimentation. Previously led MMPose development as a core contributor to OpenMMLab.

