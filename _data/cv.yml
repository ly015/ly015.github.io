    Projects:
      - name: LLM Post-training for Coding and Alignment
        date: 2023 - Present
        highlights:
          - >-
            **Atria Dawn post-training for coding.** Led post-training of Atria Dawn LLM on coding capabilities across software-engineering, terminal-use, and NL2Repo tasks; developed training-data pipelines and fine-tuned models built on GLM-5.2. [Project](https://atria-asi.ai/)
          - >-
            **InternLM 2/2.5/3: supervised fine-tuning.** Co-led SFT for the InternLM series, focusing on instruction following, response quality, style consistency, and long-context reliability. [Project](https://github.com/InternLM/InternLM)
          - >-
            **SFT data infrastructure.** Led development of LLM post-training data infrastructure spanning agent trajectory generation, SFT data curation, and high-quality response synthesis and evolution.

      - name: Autonomous AI-R&D Systems
        date: 2025 - 2026
        highlights:
          - >-
            **TREX: automated LLM fine-tuning.** Led TREX, a multi-agent system that automates LLM fine-tuning through tree-based experimental search, from research planning and data preparation to training and evaluation. Introduced FT-Bench with 10 real-world fine-tuning tasks. Demonstrated competitive model-performance gains relative to published expert-designed pipelines on TOMG-Bench and OpenFinData. [Project](https://liyn.site/projects/trex/)
          - >-
            **Kernel-Smith: evolutionary kernel optimization.** Contributed to Kernel-Smith's evolutionary kernel-optimization framework, developing agents and training models for kernel optimization on NVIDIA and MetaX accelerators. [Paper](https://arxiv.org/abs/2603.28342) · [Code](https://github.com/InternLM/Kernel-Smith)

      - name: Data Centric AI-for-AI
        date: 2024 - 2026
        highlights:
          - >-
            **DataChef: RL-generated data recipes.** Developed DataChef to generate executable SFT data recipes and trained its 8B/32B models with GRPO. Designed a low-cost proxy reward that bypasses downstream training and correlates better with downstream performance than standard data-quality metrics on average (mean Pearson r = 0.59). Demonstrated substantial gains in recipe generation across 6 tasks, including coding, math, and physics. [Paper](https://arxiv.org/abs/2602.11089) · [Code](https://github.com/yichengchen24/DataChef)
          - >-
            **MIG: efficient instruction-data curation.** Developed MIG, an information-gain-based method for instruction-data selection that balances quality and diversity; achieved performance comparable to full-data SFT using 5% of Tulu 3 training data in the reported evaluation setting. [Project](https://yichengchen24.github.io/projects/mig/)
          - >-
            **Auto Cherry-Picker: synthetic data for multimodal training.** Developed Auto Cherry-Picker, a synthetic-data framework combining language and diffusion models for downstream perception and reasoning tasks. [Project](https://yichengchen24.github.io/projects/autocherrypicker/)

      - name: "Tool-Use Agents: Benchmarks & Frameworks"
        date: 2023 - 2025
        highlights:
          - >-
            **GTA/GTA-2: general tool-agent benchmarks.** Designed GTA/GTA-2 benchmarks and evaluation pipelines for multimodal tool-use agents, spanning atomic tool use and open-ended workflows, with checkpoint-based evaluation of task completion. [Project](https://github.com/open-compass/GTA)
          - >-
            **AgentLego: multimodal tool API library.** Led development of AgentLego, a multimodal tool API library covering visual perception, image generation and editing, speech, and visual question answering, with integrations for Transformers Agents and Visual ChatGPT. [Code](https://github.com/InternLM/agentlego)

      - name: Open-Source Leadership
        date: 2021 - 2024
        highlights:
          - >-
            **OpenMMLab core development and research leadership.** Served as a core maintainer of OpenMMLab, developing the data pipeline module for its 2.0 architecture. Led research on open-vocabulary perception within the OpenMMLab ecosystem. [Project](https://github.com/open-mmlab)
          - >-
            **MMPose: open-source pose estimation toolbox.** Led development of MMPose, a pose-estimation toolbox with 7.9k GitHub stars, supporting 30+ algorithms, 35+ datasets, modular pipelines, and cross-platform deployment. [Project](https://github.com/open-mmlab/mmpose)
          - >-
            **RTMPose family: production-ready real-time pose estimation.** Developed and released a family of real-time models for 2D/3D body pose, crowded-scene pose, and whole-body keypoint estimation. Widely deployed in industry and used as a foundational pose extractor in AIGC systems (Animate Anyone, sd-webui-ControlNet, T2I Adapter). [Project](https://github.com/open-mmlab/mmpose/tree/main/projects/rtmpose)

